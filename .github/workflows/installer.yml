name: 📦 Build Stable MinecraftRLLab Setup

on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'tools/maintenance_helper.py'
      - 'tools/__init__.py'
      - 'client/rl_client/update/**'
      - 'client/rl_client/version.py'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcrl-stable-setup
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'

jobs:
  build:
    name: Setup • ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            filename: MinecraftRLLab-Setup.exe
            pythonpath: 'client;.'
          - os: ubuntu-latest
            platform: Linux
            filename: MinecraftRLLab-Setup
            pythonpath: 'client:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: 🐧 Linux compiler prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential ccache patchelf
      - name: 📚 Install bootstrap build tools
        run: python -m pip install --upgrade pip Nuitka ordered-set zstandard
      - name: 🔨 Compile stable bootstrap
        shell: bash
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
          NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-setup-cache
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=setup-dist \
            --output-filename="${{ matrix.filename }}" \
            --include-package=rl_client.update \
            --include-module=rl_client.version \
            --include-package=installer \
            --include-module=tools.maintenance_helper \
            installer/bootstrap.py
      - name: 💨 Bootstrap smoke
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "Linux" ]]; then chmod +x "setup-dist/${{ matrix.filename }}"; fi
          "setup-dist/${{ matrix.filename }}" --help
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.platform }}
          path: setup-dist/${{ matrix.filename }}
          if-no-files-found: error

  publish:
    name: Publish fixed setup release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: setup-*
          path: release-assets
          merge-multiple: true
      - name: 📦 Replace stable setup release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete setup --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create setup \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MinecraftRLLab Setup" \
            --notes "Stable bootstrap installer. It downloads and verifies the newest MinecraftRLLab application release; normal updates are performed by MinecraftRLLab itself." \
            --latest=false \
            release-assets/*
