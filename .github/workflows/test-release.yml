name: 🧪 Verify Published Release

on:
  release:
    types: [published]

permissions:
  contents: write
  actions: read

concurrency:
  group: mcrl-release-tests
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13'
  JAVA_VERSION: '25'

jobs:
  build-priority-gate:
    name: ⏸ Build priority gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
      - name: 🔨 Wait while ANY build is queued/running
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_queue.py --workflow build.yml --interval 20 --timeout 7200
      - name: ✅ Build queue empty
        run: echo "No builds are queued/running. Tests may start now."

  source-tests:
    name: 🧪 Source + protocol tests
    runs-on: ubuntu-latest
    needs: build-priority-gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: 📚 Python test dependencies
        working-directory: client
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: 🧩 Compile all Python/UI sources
        run: python -m compileall -q client/rl_client tools
      - name: 🐍 Python unit tests
        env:
          PYTHONPATH: client:.
        run: python -m unittest discover -s client/tests -p 'test_*.py' -v && python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: ☕ Paper plugin tests
        run: gradle :plugin:runTests --console=plain --info

  artifact-smoke:
    name: 💨 Released artifact smoke • ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: build-priority-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            pattern: '*Windows-x64.zip'
          - os: ubuntu-latest
            platform: Linux
            pattern: '*Linux-x64.tar.gz'
    steps:
      - name: 📥 Download EXACT published release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release download "${{ github.event.release.tag_name }}" --repo "$GITHUB_REPOSITORY" --pattern "${{ matrix.pattern }}" --dir downloaded
      - name: 📦 Extract release
        shell: bash
        run: |
          mkdir extracted
          if [[ "${{ matrix.platform }}" == "Windows" ]]; then
            7z x downloaded/*.zip -oextracted
          else
            tar -xzf downloaded/*.tar.gz -C extracted
          fi
          find extracted -maxdepth 3 -type f | sort | head -200
      - name: 🔌 Verify bundled Paper plugin
        shell: bash
        run: |
          PLUGIN=$(find extracted -type f -path '*/server-plugin/MinecraftRLLab-Plugin.jar' | head -1)
          test -n "$PLUGIN"
          unzip -l "$PLUGIN" | grep -E 'plugin.yml|MinecraftRLLabPlugin.class'
      - name: 💨 Native executable health check
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [[ "${{ matrix.platform }}" == "Windows" ]]; then
            EXE=$(find extracted -type f -name 'MinecraftRLLab.exe' | head -1)
            test -n "$EXE"
            "$EXE" --health-check
            "$EXE" --ui-smoke
          else
            EXE=$(find extracted -type f -name 'MinecraftRLLab' | head -1)
            test -n "$EXE"
            chmod +x "$EXE"
            "$EXE" --health-check
            "$EXE" --ui-smoke
          fi

  verify-release:
    name: ✅ Mark release Verified
    runs-on: ubuntu-latest
    needs: [source-tests, artifact-smoke]
    if: success()
    steps:
      - name: ✅ Promote Nightly to Verified
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          BUILD: ${{ github.event.release.name }}
        shell: bash
        run: |
          BODY=$(gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body)
          BODY=${BODY//verification:pending/verification:passed}
          BODY="$BODY

          ---
          ✅ **VERIFIED** — source tests, Paper tests, Windows smoke test, Linux smoke test passed."
          jq -n --arg body "$BODY" '{prerelease:false, body:$body}' > patch.json
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input patch.json

  failed-release:
    name: ❌ Mark verification failed
    runs-on: ubuntu-latest
    needs: [source-tests, artifact-smoke]
    if: failure()
    steps:
      - name: ❌ Keep as Nightly + record failure
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        shell: bash
        run: |
          BODY=$(gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body)
          BODY=${BODY//verification:pending/verification:failed}
          BODY="$BODY

          ---
          ❌ **VERIFICATION FAILED** — this build stays a Nightly."
          jq -n --arg body "$BODY" '{prerelease:true, body:$body}' > patch.json
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input patch.json
