name: 🔨 Build & Release MinecraftRLLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mcrl-build-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13'
  JAVA_VERSION: '25'
  MCRL_VERSION: 0.3.0-dev
  MCRL_NUITKA_VISIBLE_LOG_LIMIT: '8000'
  MCRL_GRADLE_VISIBLE_LOG_LIMIT: '5000'

jobs:
  metadata:
    name: 🧾 Build metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: meta
        shell: bash
        run: |
          BUILD="${GITHUB_RUN_NUMBER}"
          TAG="nightly-${BUILD}-${GITHUB_SHA::8}"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "# 🔨 MinecraftRLLab Build #$BUILD" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Dependencies: **prebuilt Python wheels**" >> "$GITHUB_STEP_SUMMARY"
          echo "Release starts as **Nightly / verification pending**." >> "$GITHUB_STEP_SUMMARY"

  plugin:
    name: ☕ Paper 26.2 plugin
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: 🔍 Toolchain
        run: |
          java -version
          gradle --version
      - name: 🔨 Compile and link plugin JAR
        shell: bash
        run: |
          python tools/log_mux.py \
            --log .build-logs/plugin-gradle.log \
            --max-visible "$MCRL_GRADLE_VISIBLE_LOG_LIMIT" \
            --sample-every 8 \
            -- gradle :plugin:jar --console=plain -PmcrlVersion=${{ needs.metadata.outputs.tag }}
      - name: 🧾 Upload complete plugin build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-plugin-${{ needs.metadata.outputs.build }}
          path: .build-logs/plugin-gradle.log
          if-no-files-found: warn
      - name: 📦 Stage plugin
        shell: bash
        run: |
          mkdir -p staged-plugin
          cp plugin/build/libs/*.jar staged-plugin/MinecraftRLLab-Plugin.jar
          jar tf staged-plugin/MinecraftRLLab-Plugin.jar | tee plugin-contents.txt
          sha256sum staged-plugin/MinecraftRLLab-Plugin.jar | tee staged-plugin/MinecraftRLLab-Plugin.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ needs.metadata.outputs.build }}
          path: staged-plugin/
          if-no-files-found: error

  client:
    name: 🧠 Native client • ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            platform: Windows
          - os: ubuntu-latest
            label: Linux x64
            platform: Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            client/requirements.txt
            client/requirements-build.txt

      - name: 🐧 Linux native prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf build-essential ccache libgl1 libegl1 libxkbcommon-x11-0

      - name: 📚 Install Python + native build dependencies
        working-directory: client
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-build.txt

      - name: 🔎 Nuitka / compiler information
        shell: bash
        run: |
          python --version
          python -m nuitka --version
          echo "Dependency mode: prebuilt wheels"

      - name: 🧬 Generate + compile native application
        env:
          GITHUB_RUN_NUMBER: ${{ needs.metadata.outputs.build }}
          MCRL_VERSION: ${{ env.MCRL_VERSION }}
        shell: bash
        run: |
          python tools/log_mux.py \
            --log .build-logs/nuitka.log \
            --max-visible "$MCRL_NUITKA_VISIBLE_LOG_LIMIT" \
            --sample-every 10 \
            --head-lines 120 \
            -- python tools/build_client.py --output dist

      - name: 📂 Locate standalone distribution
        id: dist
        shell: bash
        run: |
          DIST_DIR=$(find dist -maxdepth 1 -type d -name '*.dist' | head -1)
          test -n "$DIST_DIR"
          echo "dir=$DIST_DIR" >> "$GITHUB_OUTPUT"
          echo "Native files: $(find "$DIST_DIR" -type f | wc -l)"
          echo "Standalone distribution located at: $DIST_DIR"

      - name: 🧾 Upload complete native build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.platform }}-${{ needs.metadata.outputs.build }}
          path: .build-logs/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.platform }}-${{ needs.metadata.outputs.build }}
          path: ${{ steps.dist.outputs.dir }}/
          if-no-files-found: error

  package:
    name: 📦 Package • ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: [metadata, plugin, client]
    strategy:
      matrix:
        platform: [Windows, Linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-${{ needs.metadata.outputs.build }}
          path: downloads/plugin
      - uses: actions/download-artifact@v4
        with:
          name: client-${{ matrix.platform }}-${{ needs.metadata.outputs.build }}
          path: downloads/client
      - name: 🧩 Assemble client + Paper plugin
        run: |
          python tools/package_release.py \
            --platform ${{ matrix.platform }} \
            --client-dist downloads/client \
            --plugin downloads/plugin/MinecraftRLLab-Plugin.jar \
            --build ${{ needs.metadata.outputs.build }} \
            --output packages
          find packages -maxdepth 2 -type f -print
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-${{ needs.metadata.outputs.build }}
          path: packages/*
          if-no-files-found: error

  release:
    name: 🌙 Publish Nightly immediately
    runs-on: ubuntu-latest
    needs: [metadata, package]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*-${{ needs.metadata.outputs.build }}
          path: release-assets
          merge-multiple: true
      - name: 🔐 Combined checksums
        shell: bash
        run: |
          find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | sort -z | xargs -0 sha256sum | tee release-assets/SHA256SUMS.txt
      - name: 🌙 Create Nightly release BEFORE tests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          BUILD: ${{ needs.metadata.outputs.build }}
        shell: bash
        run: |
          cat > release-body.md <<BODY
          # 🌙 MinecraftRLLab Build #${BUILD}

          **verification:pending**

          This build compiled successfully and is available immediately. The release verification workflow starts only after publishing and waits until the build queue is empty.

          - ✅ Paper 26.2 plugin built
          - ✅ Windows native client built
          - ✅ Linux native client built
          - 📦 Dependencies installed from prebuilt wheels
          - ⏳ Verification queued/running
          - Commit: \`${GITHUB_SHA}\`
          BODY
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "🌙 MinecraftRLLab Nightly #${BUILD}" \
            --notes-file release-body.md \
            --prerelease \
            release-assets/*
      - name: ✨ Summary
        run: |
          echo "## 🌙 Nightly published" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests are intentionally **not** part of this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "The release-triggered verification workflow now waits for the build queue." >> "$GITHUB_STEP_SUMMARY"
